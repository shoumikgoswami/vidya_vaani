# For Docker Compose older than 2.24, which does not understand "required: false".
# Export keys in your shell if you want AI features; the app also runs without them.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DEMO_MODE: "${DEMO_MODE:-true}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:-}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
    volumes:
      - vv-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  vv-data:
