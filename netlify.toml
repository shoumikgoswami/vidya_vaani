# The hosted app: static files on Netlify's CDN, the API and background work as functions,
# Postgres on Neon. Docker (docker compose up) runs the same code in one container.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify fails a build when the value of a secret setting appears in the code or the built files.
  # Model names, addresses, switches and the publishable sign-in key are public by nature and sit in
  # this repository, even if they were imported as secret. The real keys and the database address
  # are not listed here, so they stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "CLERK_PUBLISHABLE_KEY,DEMO_MODE,PUBLIC_BASE_URL,TRUST_PROXY,OPENROUTER_MODELS,NVIDIA_ASR_PARAKEET_FUNCTION_ID,NVIDIA_ASR_WHISPER_FUNCTION_ID,NVIDIA_GRPC_HOST,NVIDIA_LLM_BASE,NVIDIA_LLM_MODEL,NVIDIA_LLM_FALLBACK,NVIDIA_TRANSLATE_MODEL,NVIDIA_TRANSLATE_HI_EN,NVIDIA_RPM_LIMIT,NVIDIA_TTS_MAGPIE_URL"

[functions]
  directory = "netlify/functions"
  # Keeps the source layout, so the app can read the files that sit beside its code.
  node_bundler = "nft"
  included_files = [
    "server/db/migrations/**",
    "server/nlp/lexicon.json",
    "server/providers/nvidia/protos/**",
    "client/i18n/**",
    "demo/**",
    "node_modules/ffmpeg-static/ffmpeg",
    "!node_modules/ffmpeg-static/ffmpeg.exe",
    # The built-in database is only for the container.
    "!node_modules/@electric-sql/**",
  ]

# The API takes /api/* and /healthz itself (netlify/functions/api.mjs).

# Every other address is the single-page app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
